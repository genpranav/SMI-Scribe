name: SMIScribe
options:
  bundleIdPrefix: com.smi
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  ScribeKit:
    path: Packages/ScribeKit
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.32.3
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: 1.0.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.5
targets:
  SMIScribe:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Info.plist", "*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.smi.scribe
        PRODUCT_NAME: SMI Scribe
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/SMIScribe.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
    dependencies:
      - package: ScribeKit
        product: ScribeKit
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
schemes:
  SMIScribe:
    build:
      targets:
        SMIScribe: all
